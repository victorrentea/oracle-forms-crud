cucumber.junit-platform.discovery.as-root-engine=false
cucumber.publish.quiet=true
# tests run side by side, one per Forms worker (FormsPool, -Dworkers); a test waits for a free worker
junit.jupiter.execution.parallel.enabled=true
junit.jupiter.execution.parallel.mode.default=concurrent
junit.jupiter.execution.parallel.config.strategy=fixed
junit.jupiter.execution.parallel.config.fixed.parallelism=3
cucumber.execution.parallel.enabled=true
cucumber.execution.parallel.config.strategy=fixed
cucumber.execution.parallel.config.fixed.parallelism=3
